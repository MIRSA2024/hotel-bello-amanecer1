include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  q-reservas-dlq {}
  q-notificaciones-dlq {}

  q-reservas {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "q-reservas-dlq"
      maxReceiveCount = 5
    }
  }

  q-notificaciones {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "q-notificaciones-dlq"
      maxReceiveCount = 5
    }
  }
}
